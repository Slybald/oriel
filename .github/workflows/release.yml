name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # La suite complète d'abord : la 1.2.1 était partie alors que la CI de son commit était rouge.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      # Signature de code stable. Avec une signature ad hoc le cdhash change à chaque build et macOS oublie les
      # autorisations (calendrier, Bluetooth, Automation, dossiers). Le certificat auto-signé (secrets
      # SIGNING_CERT_P12 en base64 et SIGNING_CERT_PASSWORD) donne une exigence désignée fixe : il vit dans un
      # trousseau temporaire, supprimé en fin de job. Sans les secrets, pas de release.
      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            echo "::error::Secrets SIGNING_CERT_P12 et SIGNING_CERT_PASSWORD absents : release annulée (une app signée ad hoc ferait redemander toutes les autorisations)."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/oriel-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # Nom du certificat d'avant le renommage, à garder : un autre certificat ferait perdre les autorisations.
          echo "SIGN_IDENTITY=Claude Notch Self-Signed" >> "$GITHUB_ENV"
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # Autorise codesign à utiliser la clé sans invite (aucune interface sur le runner).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      # L'Updater de l'app lit les releases de ce dépôt : une app publiée ailleurs ne verrait jamais ses mises à jour.
      - name: Check update repository
        run: |
          REPOSITORY=$(sed -n 's|.*static let latestReleaseURL = URL(string: "https://api.github.com/repos/\([^/]*/[^/]*\)/releases/latest").*|\1|p' Sources/Oriel/Updater.swift)
          if [ "$REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Updater.swift lit les releases de « $REPOSITORY », la release part sur « $GITHUB_REPOSITORY »."
            exit 1
          fi

      # RELEASE_CHANNEL=1 : seule cette app se met à jour seule depuis les releases (Updater.swift).
      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          RELEASE_CHANNEL=1 VERSION="$VERSION" scripts/build.sh
          lipo -archs build/Oriel.app/Contents/MacOS/Oriel
          test "$(/usr/libexec/PlistBuddy -c 'Print :OrielUpdateChannel' build/Oriel.app/Contents/Info.plist)" = release

      # Une exigence désignée « certificate leaf = H"…" » ne dépend que du certificat ; « cdhash » voudrait dire
      # que la signature est ad hoc (autorisations perdues à chaque mise à jour).
      - name: Check code signature
        run: |
          APP=build/Oriel.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Une signature ad hoc s'affiche « # designated => cdhash … » (exigence calculée, pas intégrée).
          REQUIREMENT=$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^[# ]*designated => //p')
          echo "Exigence désignée : $REQUIREMENT"
          if echo "$REQUIREMENT" | grep -q cdhash || ! echo "$REQUIREMENT" | grep -Eq 'certificate leaf = H"[0-9a-f]{40}"'; then
            echo "::error::Signature non stable : l'exigence désignée ne repose pas sur le certificat."
            exit 1
          fi

      - name: Build DMG
        run: scripts/make-dmg.sh

      # Signature Ed25519 du DMG, vérifiée avec la clé publique intégrée à l'app : un secret absent ou qui ne
      # correspond pas à cette clé fait échouer le job (les installations existantes refuseraient la mise à jour).
      - name: Sign DMG
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          PUBLIC_KEY=$(sed -n 's/.*static let publicKey = "\([^"]*\)".*/\1/p' Sources/Oriel/Updater.swift)
          test -n "$PUBLIC_KEY"
          DMG="build/Oriel-$VERSION.dmg"
          swift scripts/update-signing.swift sign "$DMG" > "$DMG.sig"
          test -s "$DMG.sig"
          swift scripts/update-signing.swift verify "$DMG" "$(cat "$DMG.sig")" "$PUBLIC_KEY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/Oriel-$VERSION.dmg" \
            "build/Oriel-$VERSION.dmg.sha256" \
            "build/Oriel-$VERSION.dmg.sig" \
            --title "Oriel $VERSION" \
            --notes "Download **Oriel-$VERSION.dmg**. First launch: see the *First launch* file inside the image, or the README." \
            --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
