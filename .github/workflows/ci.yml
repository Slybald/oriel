name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Appelée par release.yml : une version n'est publiée qu'après une CI verte sur son commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26, comme la release : le même SDK que le binaire publié, dont dépend l'apparence des contrôles système.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      # Rendus PNG de toute la suite (ORIEL_SNAPSHOT_DIR lève les sauts), à regarder dans les artefacts de l'exécution
      # (rien ne se lance sur le Mac).
      - name: Test
        env:
          ORIEL_SNAPSHOT_DIR: ${{ runner.temp }}/renders
        run: swift test

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: ${{ runner.temp }}/renders
          retention-days: 14
